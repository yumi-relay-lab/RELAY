<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RELAY | 実践を投稿する</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>

<header>

<h1>🏫 RELAY</h1>

<p>教育実践ひろば</p>

</header>


<main>

<h2>＋ 実践を投稿する</h2>


<form id="postForm">


<label for="author">
👤 実践者（ニックネーム）
</label>

<input
    type="text"
    id="author"
    placeholder="例：ゆみ先生"
    required>


<label for="schoolDivision">
🏫 学部
</label>

<select id="schoolDivision" required>

<option value="">選択してください</option>

<option value="小学部">小学部</option>

<option value="中学部">中学部</option>

<option value="高等部">高等部</option>

</select>


<label for="title">
📝 実践タイトル
</label>

<input
    type="text"
    id="title"
    placeholder="例：見通しをもって活動するための視覚支援"
    required>


<label for="purpose">
🎯 ねらい・目的
</label>

<textarea
    id="purpose"
    rows="5"
    placeholder="この実践で大切にしたこと、ねらいを書いてください"
    required></textarea>


<label for="howToUse">
💡 実践方法
</label>

<textarea
    id="howToUse"
    rows="7"
    placeholder="実際にどのような方法で実践したかを書いてください"
    required></textarea>


<label for="reflection">
🌱 実践してみて
</label>

<textarea
    id="reflection"
    rows="7"
    placeholder="子どもの様子や、実践してみて分かったことを書いてください"
    required></textarea>


<fieldset class="tag-selector" aria-describedby="postTagHelp">

<legend>🏷️ タグ</legend>

<p id="postTagHelp" class="tag-selector-help">
この実践に近いタグを選んでください（複数選択可）
</p>

<div id="postTagOptions" class="tag-options"></div>

</fieldset>


<section class="attachment-area" aria-labelledby="attachmentHeading">

<h3 id="attachmentHeading">📎 資料を添付</h3>

<label class="attachment-drop-zone" id="attachmentDropZone" for="attachments">

<span class="attachment-main-text">
ここへドラッグ＆ドロップ<br>
またはクリックして選択
</span>

<span>画像・PDF・Word・Excel</span>

<span class="attachment-limit">
最大3ファイル<br>
1ファイル5MBまで
</span>

</label>

<input
    type="file"
    id="attachments"
    class="attachment-input"
    accept=".jpg,.jpeg,.png,.webp,.pdf,.doc,.docx,.xls,.xlsx,image/jpeg,image/png,image/webp,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    multiple>

<p id="attachmentStatus" class="attachment-status" aria-live="polite"></p>

<ul id="attachmentList" class="attachment-list" aria-label="選択した添付資料"></ul>

<div id="privacyConfirmation" class="privacy-confirmation" hidden>

<label for="privacyConfirmed">
<input type="checkbox" id="privacyConfirmed">
<span>
添付資料に、児童生徒や教職員など個人を特定できる氏名・顔写真・住所・連絡先等の個人情報が含まれていないことを確認しました。
</span>
</label>

</div>

</section>


<button
    type="submit"
    class="submit-button">
    📤 実践を投稿する
</button>


</form>

</main>


<script type="module" src="js/post.js"></script>

</body>

</html>
