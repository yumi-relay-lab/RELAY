<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RELAY | 実践を編集する</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
<h1>🏫 RELAY</h1>
<p>教育実践ひろば</p>
</header>

<main>

<section class="edit-page" aria-labelledby="editHeading">
<h2 id="editHeading">✏️ 実践を編集する</h2>

<p id="editStatus" class="edit-status" role="status" aria-live="polite">
投稿を読み込んでいます…
</p>

<form id="editForm" class="edit-form" hidden>

<label for="schoolDivision">
🏫 学部
</label>
<select id="schoolDivision" required>
<option value="">選択してください</option>
<option value="小学部">小学部</option>
<option value="中学部">中学部</option>
<option value="高等部">高等部</option>
</select>

<label for="title">
📝 実践タイトル
</label>
<input type="text" id="title" required>

<label for="purpose">
🎯 ねらい・目的
</label>
<textarea id="purpose" rows="5" required></textarea>

<label for="howToUse">
💡 実践方法
</label>
<textarea id="howToUse" rows="7" required></textarea>

<label for="reflection">
🌱 実践してみて
</label>
<textarea id="reflection" rows="7" required></textarea>

<label for="aiTags">
🏷️ タグ（カンマ区切り）
</label>
<input
    type="text"
    id="aiTags"
    placeholder="例：視覚支援, 自立活動, 教材">

<section class="edit-attachments" aria-labelledby="editAttachmentsHeading">
<h3 id="editAttachmentsHeading">📎 現在の添付ファイル</h3>
<p id="editNoAttachments" class="edit-no-attachments" hidden>
添付ファイルはありません。
</p>
<div id="editAttachmentList" class="edit-attachment-list"></div>
</section>

<section class="attachment-area edit-add-attachments" aria-labelledby="editAddAttachmentsHeading">
<h3 id="editAddAttachmentsHeading">➕ 新しい添付ファイルを追加</h3>

<label class="attachment-drop-zone" id="editAttachmentDropZone" for="editAttachments">
<span class="attachment-main-text">
ここへドラッグ＆ドロップ<br>
またはクリックして選択
</span>
<span>画像・PDF・Word・Excel</span>
<span class="attachment-limit">
既存添付と合わせて最大3ファイル<br>
1ファイル5MBまで
</span>
</label>

<input
    type="file"
    id="editAttachments"
    class="attachment-input"
    accept=".jpg,.jpeg,.png,.webp,.pdf,.doc,.docx,.xls,.xlsx,image/jpeg,image/png,image/webp,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    multiple>

<p id="editAttachmentStatus" class="attachment-status" aria-live="polite"></p>

<ul id="editNewAttachmentList" class="attachment-list" aria-label="追加予定の添付ファイル"></ul>

<div id="editPrivacyConfirmation" class="privacy-confirmation" hidden>
<label for="editPrivacyConfirmed">
<input type="checkbox" id="editPrivacyConfirmed">
<span>
添付資料に、児童生徒や教職員など個人を特定できる氏名・顔写真・住所・連絡先等の個人情報が含まれていないことを確認しました。
</span>
</label>
</div>
</section>

<button id="saveEditButton" type="submit" class="submit-button">
💾 変更を保存する
</button>

<a id="cancelEditLink" class="edit-cancel-link" href="index.html">
キャンセルして戻る
</a>

</form>
</section>

</main>

<script type="module" src="js/edit.js"></script>

</body>
</html>
