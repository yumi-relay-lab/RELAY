<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RELAY Lab | 福岡中央特別支援学校　教育実践ひろば</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="top-page">

<header class="top-header">
    <div class="top-header-inner">
        <div class="top-header-main">
            <a class="top-brand top-brand-link" href="index.html" aria-label="RELAY Labトップページへ戻る">
                <img
                    class="top-brand-logo"
                    src="images/relay-logo.png"
                    alt="RELAY Lab 明日の『やってみよう』がみつかる">
            </a>
            <p class="top-brand-description">福岡中央特別支援学校　教育実践ひろば</p>
            <p class="top-introduction">
                先生たちの小さな工夫や実践を、次の誰かのヒントにつなぐ場所です。
            </p>
        </div>

        <section class="auth-controls" aria-label="ログイン">
            <p id="authStatus" class="auth-status" aria-live="polite">
                ログインしていません
            </p>
            <button id="googleSignInButton" class="auth-button" type="button">
                Googleでサインイン
            </button>
            <button id="signOutButton" class="auth-button" type="button" hidden>
                ログアウト
            </button>
        </section>
    </div>
</header>

<main class="top-main">

<section class="search search-panel" aria-labelledby="searchPanelHeading">

    <div class="search-panel-heading">
        <div>
            <p class="search-panel-label">実践を探す</p>
            <h2 id="searchPanelHeading">明日に役立つ実践を探す</h2>
            <p class="search-panel-help">教材名・活動・困りごとから検索できます。例：視覚支援、朝の支度、買い物学習、ICT</p>
        </div>

        <div class="post-entry">
            <a class="post-primary-button" href="post.html">
                ＋ 実践を投稿する
            </a>
            <p class="post-entry-help">短いメモや、小さな工夫でも大丈夫です</p>
        </div>
    </div>

    <form id="searchForm" class="search-form" role="search">
        <label class="visually-hidden" for="postSearchInput">実践を検索</label>
        <input
            id="postSearchInput"
            type="search"
            placeholder="教材名・活動・困りごとから実践を探す"
            autocomplete="off">

        <button type="submit">
            🔍 検索
        </button>

        <button id="clearSearchButton" class="search-clear-button" type="button" hidden>
            絞り込みをクリア
        </button>
    </form>

    <div class="filter-area">
        <fieldset id="divisionFilter" class="division-filter">
            <legend>学部で絞り込む</legend>
            <div class="division-filter-options">
                <button class="division-filter-button is-selected" type="button" data-division="" aria-pressed="true">すべて</button>
                <button class="division-filter-button" type="button" data-division="小学部" aria-pressed="false">小学部</button>
                <button class="division-filter-button" type="button" data-division="中学部" aria-pressed="false">中学部</button>
                <button class="division-filter-button" type="button" data-division="高等部" aria-pressed="false">高等部</button>
            </div>
        </fieldset>

        <fieldset id="tagFilter" class="tag-filter">
            <legend class="visually-hidden">タグで絞り込む（複数選択可）</legend>
            <div class="tag-filter-heading">
                <span id="tagFilterSummary" class="tag-filter-summary" aria-live="polite">
                    タグで絞り込む
                </span>
                <button
                    id="tagFilterToggle"
                    class="tag-filter-toggle"
                    type="button"
                    aria-expanded="false"
                    aria-controls="tagFilterOptions">
                    タグを表示 ▾
                </button>
            </div>
            <div id="tagFilterOptions" class="tag-filter-options" hidden></div>
        </fieldset>
    </div>

    <p id="searchResultCount" class="search-result-count" aria-live="polite">
        投稿を読み込んでいます…
    </p>

</section>

<div class="posts-heading">
    <div>
        <p class="posts-heading-label">NEW PRACTICES</p>
        <h2>新着の実践</h2>
    </div>
    <p>新しい工夫から、気軽にヒントを探せます。</p>
</div>

<section id="posts">

    <!-- 投稿カードがここに表示されます -->

</section>

<div class="load-more-area">
    <button id="loadMoreButton" class="load-more-button" type="button" hidden>
        もっと見る
    </button>
</div>

</main>

<script type="module" src="js/auth.js"></script>
<script type="module" src="js/script.js"></script>

</body>
</html>
