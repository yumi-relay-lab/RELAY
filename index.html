<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RELAY | 福岡中央特別支援学校　教育実践ひろば</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1>RELAY</h1>
    <p>福岡中央特別支援学校　教育実践ひろば</p>
    <h2>
        あなたの実践が<br>
        わたしたちの力になる
    </h2>

    <section class="auth-controls" aria-label="ログイン">
        <p id="authStatus" class="auth-status" aria-live="polite">
            ログインしていません
        </p>
        <button id="googleSignInButton" class="auth-button" type="button">
            Googleでサインイン
        </button>
        <button id="signOutButton" class="auth-button" type="button" hidden>
            ログアウト
        </button>
    </section>
</header>

<main>

<section class="search">

    <input
        type="text"
        placeholder="実践を探す">

    <button>
        🔍 検索
    </button>

</section>

<section class="post-button">

    <a href="post.html">
        ＋ 実践を投稿する
    </a>

</section>

<section id="posts">

    <!-- 投稿カードがここに表示されます -->

</section>

</main>

<script type="module" src="js/auth.js"></script>
<script type="module" src="js/script.js"></script>

</body>
</html>
