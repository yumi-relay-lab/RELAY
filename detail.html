<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RELAY | 福岡中央特別支援学校 教育実践</title>

<link rel="stylesheet" href="../css/style.css">

<style>

body{
    margin:0;
    background:#f4f7fb;
    font-family:"Yu Gothic","Meiryo",sans-serif;
}


header{

    background:#1565C0;
    color:white;
    padding:25px;

}


header h1{

    margin:0;
    font-size:28px;

}


.container{

    max-width:900px;
    margin:auto;
    padding:30px;

}


.card{

    background:white;
    border-radius:15px;
    padding:35px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);

}


.detail-image{

    max-width:100%;
    border-radius:12px;
    margin:20px 0;

}



.tag{

    display:inline-block;
    background:#E3F2FD;
    color:#1565C0;
    padding:5px 12px;
    border-radius:20px;
    margin:3px;
    font-size:14px;

}



.section{

    margin-top:35px;

}



.section h2{

    color:#1565C0;
    border-left:6px solid #1565C0;
    padding-left:10px;
    margin-bottom:15px;

}



.section p{

    line-height:2;
    font-size:17px;

}



/* =========================
リアクション機能
========================= */

.reaction{

    margin-top:30px;

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));

    gap:15px;

}



.reaction button{

    padding:15px;

    font-size:16px;

    border:none;

    border-radius:12px;

    background:#1565C0;

    color:white;

    cursor:pointer;

    transition:.3s;

}



.reaction button:hover{

    background:#0D47A1;

    transform:translateY(-2px);

}



.reaction-count{

    margin-left:8px;

    font-weight:bold;

}



/* =========================
🤝ありがとうメッセージ
========================= */


.thanks-area{

    margin-top:40px;

    padding:25px;

    background:#f7f9fc;

    border-radius:15px;

}



.thanks-area h3{

    color:#1565C0;

}



#thanksMessage{

    width:100%;

    height:100px;

    padding:10px;

    border-radius:10px;

    border:1px solid #ccc;

    font-size:16px;

    box-sizing:border-box;

}



#thanksButton{

    margin-top:15px;

    padding:12px 25px;

    border:none;

    border-radius:10px;

    background:#43A047;

    color:white;

    font-size:16px;

    cursor:pointer;

}



#thanksButton:hover{

    background:#2E7D32;

}



.thanks-item{

    margin-top:15px;

    background:white;

    padding:15px;

    border-radius:10px;

    border-left:5px solid #43A047;

}

#thanksList{

    margin-top:20px;

}


/* =========================
戻るボタン
========================= */

.back{

    margin-top:40px;

    text-align:center;

}



.back a{

    display:inline-block;

    background:#43A047;

    color:white;

    padding:15px 35px;

    border-radius:10px;

    text-decoration:none;

    font-weight:bold;

}



.back a:hover{

    background:#2E7D32;

}


</style>

</head>



<body>



<header>

<h1>RELAY</h1>

<p>教育実践ひろば</p>

</header>




<div class="container">


<div class="card">



<h2 id="title">
読み込み中...
</h2>




<img id="image" class="detail-image" alt="実践写真">




<p>

<strong>学部：</strong>

<span id="department"></span>

</p>



<div id="tags"></div>






<div class="section">


<h2>
教材のねらい
</h2>


<p id="purpose"></p>


</div>






<div class="section">


<h2>
学習方法（使い方）
</h2>


<p id="method"></p>


</div>







<div class="section">


<h2>
実践してみて
</h2>


<p id="practice"></p>


</div>







<div class="section">


<h2>
この実践を受け取った先生のリアクション
</h2>



<div class="reaction">



<button data-reaction="thanks">

🤝 ありがとう

<span class="reaction-count">
0
</span>

</button>




<button data-reaction="reference">

💡 参考になりました

<span class="reaction-count">
0
</span>

</button>




<button data-reaction="try">

🌱 やってみます

<span class="reaction-count">
0
</span>

</button>




<button data-reaction="done">

🔄 実践しました

<span class="reaction-count">
0
</span>

</button>




<button data-reaction="idea">

✨ 工夫を加えてみました

<span class="reaction-count">
0
</span>

</button>




<button data-reaction="question">

💬 詳しく知りたいです

<span class="reaction-count">
0
</span>

</button>




</div>



</div>






<!-- =========================
🤝ありがとうメッセージ機能
========================= -->


<div class="thanks-area">


<h3>
🤝 ありがとうを送る
</h3>



<textarea

id="thanksMessage"

placeholder="実践への感謝や気づきを入力してください">

</textarea>




<button id="thanksButton">

送信する

</button>





<div id="thanksList">

</div>



</div>








<div class="back">


<a href="index.html">

← 一覧へ戻る

</a>


</div>




</div>


</div>






<script src="js/detail.js"></script>



</body>


</html>
