<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RELAY Lab | 教育実践ひろば</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body class="detail-page">

<header class="site-header"><div class="site-header-inner"><div class="site-header-brand"><a href="index.html" aria-label="RELAY Labトップページへ戻る"><img src="images/relay-logo.png" alt="RELAY Lab 明日の『やってみよう』がみつかる"></a><p>福岡中央特別支援学校　教育実践ひろば</p></div><nav class="site-nav" aria-label="主要ナビゲーション"><a href="index.html#searchPanelHeading" aria-current="page">実践を探す</a><a href="philosophy.html">RELAYについて</a><a href="tags.html">実践タグについて</a><a href="jiritsu.html">自立活動について</a><a href="post.html">実践を投稿する</a><a class="site-nav-login" href="index.html#login">ログイン</a></nav></div></header>


<div class="container detail-container">

<main class="card detail-content">

<h2 id="title" class="detail-title">
読み込み中...
</h2>


<img id="image" class="detail-image" alt="実践写真">


<p class="detail-meta">
<strong>学部：</strong>
<span id="department"></span>
</p>


<div id="tags" class="detail-tags"></div>
<div id="jiritsuCategories" class="detail-jiritsu" hidden></div>


<section class="section detail-reading-section">
<h2>🎯 ねらい</h2>
<p id="purpose"></p>
</section>


<section class="section detail-reading-section">
<h2>💡 実践のしかた</h2>
<p id="method"></p>
</section>


<section class="section detail-reading-section">
<h2>🌱 やってみて</h2>
<p id="practice"></p>
</section>


<section id="detailAttachments" class="section detail-attachments" hidden>
<h2>📎 添付資料</h2>
<div id="detailAttachmentList" class="detail-attachment-list"></div>
</section>


<div id="ownerActions" class="owner-actions" hidden>
<button id="editPostButton" class="owner-action-button owner-edit-button" type="button">
✏️ 編集
</button>
<button id="deletePostButton" class="owner-action-button owner-delete-button" type="button">
🗑️ 削除
</button>
<p id="ownerActionStatus" class="owner-action-status" role="status" aria-live="polite" hidden></p>
</div>



<section class="section detail-interaction-section">

<h2>
この実践へのリアクション
</h2>


<div class="reaction">


<button data-reaction="thanks">
🤝 ありがとう
<span class="reaction-count">0</span>
</button>

<button data-reaction="try">
🌱 やってみたい
<span class="reaction-count">0</span>
</button>


<button data-reaction="done">
🔄 実践しました
<span class="reaction-count">0</span>
</button>


</div>

</section>



<div class="thanks-area">


<h3>
🤝実践へのメッセージ
</h3>


<textarea
id="thanksMessage"
placeholder="感謝・気づき・質問を入力してください">
</textarea>


<button id="thanksButton">
送信する
</button>

<p id="thanksActionStatus" class="thanks-action-status" role="status" aria-live="polite" hidden></p>


<div id="thanksList"></div>


</div>



<!-- 校内共有 -->

<div class="share-area">

<button id="shareButton">

🖨️ 印刷用ページを開く

</button>

</div>



<aside class="dev-panel dev-info" aria-label="開発用確認パネル" hidden>

<p class="dev-panel-title">開発用確認パネル</p>

<div id="devPanelContent"></div>

<p id="devPanelStatus" class="dev-panel-status" role="status" aria-live="polite" hidden></p>

</aside>



<div class="back">

<a href="index.html">
←一覧へ戻る
</a>

</div>



</main>

</div>



<script type="module" src="js/detail.js"></script>


</body>

</html>
