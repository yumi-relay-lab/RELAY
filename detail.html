<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RELAY | 教育実践ひろば</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>

<header>
<h1>RELAY</h1>
<p>教育実践ひろば</p>
</header>


<div class="container">

<div class="card">

<h2 id="title">
読み込み中...
</h2>


<img id="image" class="detail-image" alt="実践写真">


<p>
<strong>学部：</strong>
<span id="department"></span>
</p>


<div id="tags"></div>


<div class="section">
<h2>教材のねらい</h2>
<p id="purpose"></p>
</div>


<div class="section">
<h2>学習方法（使い方）</h2>
<p id="method"></p>
</div>


<div class="section">
<h2>実践してみて</h2>
<p id="practice"></p>
</div>


<div id="detailAttachments" class="section detail-attachments" hidden>
<h2>添付資料</h2>
<div id="detailAttachmentList" class="detail-attachment-list"></div>
</div>


<div id="ownerActions" class="owner-actions" hidden>
<button id="editPostButton" class="owner-action-button owner-edit-button" type="button">
✏️ 編集する
</button>
<button id="deletePostButton" class="owner-action-button owner-delete-button" type="button">
🗑️ 削除する
</button>
<p id="ownerActionStatus" class="owner-action-status" role="status" aria-live="polite" hidden></p>
</div>



<div class="section">

<h2>
この実践を受け取った先生のリアクション
</h2>


<div class="reaction">


<button data-reaction="thanks">
🤝ありがとう
<span class="reaction-count">0</span>
</button>


<button data-reaction="reference">
💡参考になりました
<span class="reaction-count">0</span>
</button>


<button data-reaction="try">
🌱やってみます
<span class="reaction-count">0</span>
</button>


<button data-reaction="done">
🔄実践しました
<span class="reaction-count">0</span>
</button>


<button data-reaction="idea">
✨工夫を加えてみました
<span class="reaction-count">0</span>
</button>


<button data-reaction="question">
💬詳しく知りたいです
<span class="reaction-count">0</span>
</button>


</div>

</div>



<div class="thanks-area">


<h3>
🤝実践へのメッセージ
</h3>


<textarea
id="thanksMessage"
placeholder="感謝・気づき・質問を入力してください">
</textarea>


<button id="thanksButton">
送信する
</button>

<p id="thanksActionStatus" class="thanks-action-status" role="status" aria-live="polite" hidden></p>


<div id="thanksList"></div>


</div>



<!-- 校内共有 -->

<div class="share-area">

<button id="shareButton">

📄校内共有資料を作成

</button>

</div>



<div class="back">

<a href="index.html">
←一覧へ戻る
</a>

</div>



</div>

</div>



<script type="module" src="js/detail.js"></script>


</body>

</html>
